<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bíblia CCB</title>
  <meta name="description" content="Bíblia gratuita, sem login e que funciona sem internet. Leia, marque, favorite e compartilhe versículos.">
  <meta name="theme-color" content="#1F4E79">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bíblia CCB">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica o tema antes de desenhar a página, para não piscar branco no modo escuro.
    try {
      var t = JSON.parse(localStorage.getItem('bccb:prefs') || '{}').tema || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
      document.documentElement.dataset.tema = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Navegação principal">
      <a href="#/" data-tab="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg><span>Início</span></a>
      <a href="#/ler" data-tab="ler"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"/><path d="M12 6v14"/></svg><span>Ler</span></a>
      <a href="#/buscar" data-tab="buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span>Buscar</span></a>
      <a href="#/hinario" data-tab="hinario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span>Hinário</span></a>
      <a href="#/salvos" data-tab="salvos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg><span>Salvos</span></a>
    </nav>
    <div id="sheet-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript>Para usar a Bíblia CCB, ative o JavaScript do navegador.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
